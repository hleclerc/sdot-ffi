# The `loom` and `sdot` wheels, with the CATALOGUE of precompiled kernels (see
# `loom/compilation/catalogue.py` and the `loom-kernels` command).
#
# WHY HERE, in the sdot repository, when the catalogue is a loom matter: it is the
# `sdot` wheel that CARRIES the binaries (`sdot/catalogue/`), and `catalogue_record/` is versioned
# alongside. The producer of the record and the consumer of the binaries are therefore in the same
# repository, and the workflow only has one checkout to add -- that of loom, which remains a pure
# python wheel.
#
# The record of the sources (`catalogue_record/`) is made on a development machine -- the calls
# must be EXECUTED, hence a GPU for the CUDA part -- and versioned with the repository. Here we
# only COMPILE that record, per platform and per variant, without a GPU:
#   - Linux x86-64: the v2, v3, v4 levels in the same wheel (the import loads the richest one that
#     the machine supports), and the CUDA catalogue (fatbin sm_70..sm_90) with the CUDA compiler of the
#     pip package;
#   - macOS arm64: armv8-a.
# A wheel is self-sufficient: standard usage has nothing to compile; the rest is compiled on the spot if
# a compiler is there (`LOOM_KERNELS=auto`). Eigen and AMGCL (the linear solvers of the transport)
# are downloaded by loom itself at the first compiled kernel (`loom/compilation/externals.py`).
# The final validation runs with `LOOM_KERNELS=catalogue`: a stale record (sources that no longer
# match what loom generates) fails there, instead of silently falling back to
# compilation.
#
# `loom` remains a pure python wheel (its C++ sources are compiled on the spot); `sdot` carries
# binaries independent of the python ABI (ctypes): `py3-none-<platform>`.
#
# Triggered on a `v*` tag (a release) or by hand.

name: wheels

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    # the manylinux image: what is compiled here runs on any glibc >= 2.28
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      PATH: /opt/python/cp312-cp312/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - uses: actions/checkout@v4
      # loom has lived in its own repository since the four packages were split: we put it
      # alongside, where `pip wheel loom` and the `-I` of the compilation expect it.
      - uses: actions/checkout@v4
        with:
          repository: hleclerc/loom
          path: loom
      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ninja wheel "jax[cuda13]" "nvidia-cuda-nvcc<13.4" "nvidia-cuda-crt<13.4" "nvidia-nvvm<13.4"
          python -m pip install -e loom -e .
      - name: CPU catalogue, one variant per level
        run: |
          for v in x86-64-v2 x86-64-v3 x86-64-v4; do
            loom-kernels compile --record catalogue_record --out catalogue --import sdot --variant $v
          done
      - name: CUDA catalogue (compilation only, no GPU)
        run: |
          loom-kernels compile --record catalogue_record --out catalogue --import sdot --device cuda --arch sm_70,sm_75,sm_80,sm_86,sm_89,sm_90
      - name: wheels
        run: |
          python -m pip wheel --no-deps -w dist loom
          python -m pip wheel --no-deps -w dist .
          python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag manylinux_2_28_x86_64 dist/sdot-*.whl
      - name: validation in a fresh venv, catalogue only
        run: |
          LOOM_KERNELS=catalogue python scripts/validate_wheel.py --wheel dist/loom-*.whl dist/sdot-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist/*.whl

  macos-arm64:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hleclerc/loom
          path: loom
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ninja wheel jax
          python -m pip install -e loom -e .
      - name: CPU catalogue
        run: |
          loom-kernels compile --record catalogue_record --out catalogue --import sdot --variant armv8-a
      - name: wheels
        run: |
          python -m pip wheel --no-deps -w dist loom
          python -m pip wheel --no-deps -w dist .
          python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag macosx_11_0_arm64 dist/sdot-*.whl
      - name: validation in a fresh venv, catalogue only
        run: |
          LOOM_KERNELS=catalogue python scripts/validate_wheel.py --wheel dist/loom-*.whl dist/sdot-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: dist/*.whl
