[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "loom",
    "numpy",
    "scipy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sdot"]

[tool.hatch.build.targets.wheel.force-include]
"include" = "sdot/_include"
# les noyaux precompiles, s'ils ont ete batis (scripts/build_catalogue.py) -- absents d'un checkout
"catalogue" = "sdot/_catalogue"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "include",
]
