[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "loom",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sdot"]

[tool.hatch.build.targets.wheel.force-include]
"include" = "sdot/_include"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "include",
]
