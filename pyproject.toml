[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "loom",
    "numpy",
    "scipy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sdot"]

[tool.hatch.build.targets.wheel.force-include]
"include" = "sdot/_include"
# precompiled kernels, if they have been built (scripts/build_catalogue.py) -- absent from a checkout
"catalogue" = "sdot/_catalogue"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "include",
]
